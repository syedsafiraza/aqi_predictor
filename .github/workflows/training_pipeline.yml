name: Training Pipeline (daily)

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python training_pipeline.py
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      - name: Commit updated models + db
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          if [ -d models ]; then
            git add -f models/
          fi
          if [ -f data/aqi_store.db ]; then
            git add -f data/aqi_store.db
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update trained models [skip ci]"
            git push
          fi
