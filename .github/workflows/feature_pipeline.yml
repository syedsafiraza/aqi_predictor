name: Feature Pipeline (hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python feature_pipeline.py
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      - name: Commit updated database
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git add data/aqi_store.db
          git diff --cached --quiet || git commit -m "Auto-update feature store [skip ci]"
          git push
