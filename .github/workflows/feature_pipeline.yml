name: Feature Pipeline (hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python feature_pipeline.py
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      - name: Commit updated database
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          if [ -f data/aqi_store.db ]; then
            git add -f data/aqi_store.db
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update feature store [skip ci]"
            git push
          fi

