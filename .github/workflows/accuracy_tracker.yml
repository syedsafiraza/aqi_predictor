name: Accuracy Tracker (daily)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python accuracy_tracker.py
      - name: Commit updated forecast log
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git add data/aqi_store.db
          git diff --cached --quiet || git commit -m "Auto-update forecast accuracy log [skip ci]"
          git push
