name: Accuracy Tracker (daily)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python accuracy_tracker.py
      - name: Commit updated forecast log
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          if [ -f data/aqi_store.db ]; then
            git add -f data/aqi_store.db
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update forecast accuracy log [skip ci]"
            git push
          fi
